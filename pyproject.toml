[project]
name = "skupper-trafilatura-audit"
version = "0.1.0"
description = "Crawl Skupper v2 pages and analyse extracted documentation with Trafilatura"
requires-python = ">=3.10"
dependencies = ["trafilatura>=2.3,<3"]

[project.scripts]
skupper-audit = "skupper_audit:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["skupper_audit.py"]
